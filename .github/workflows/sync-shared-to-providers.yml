name: Sync Shared Sources To Providers

# 合并到 main 后，如果共享原件有变化，自动在 HLE-Providers 开同步 PR。
# 需要仓库 Secret CROSS_REPO_TOKEN：对 HLE-Providers 有 Contents、Pull requests 与 Actions 写权限的
# fine-grained PAT（两个仓库共用同一个 token）。未配置时只输出提示，不失败。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-shared-to-providers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROVIDERS_REPO: juren233/HLE-Providers
      SYNC_BRANCH: sync/core-shared
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changes to shared sources
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CORE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE_SHA" "$CORE_SHA" | python3 scripts/sync_shared_to_providers.py --filter sources)
          if [ -z "$changed" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "共享原件没有变化。 / Shared sources did not change."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$changed"
          fi
      - name: Check sync token
        id: token
        if: steps.detect.outputs.run == 'true'
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_TOKEN" ]; then
            echo "::notice::未配置 CROSS_REPO_TOKEN，跳过自动同步；请手动运行 scripts/sync_shared_to_providers.py。 / CROSS_REPO_TOKEN is not set; skipping the automatic sync. Run scripts/sync_shared_to_providers.py manually."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout HLE-Providers
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          repository: juren233/HLE-Providers
          ref: main
          path: providers
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - name: Sync and open PR
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          CORE_SHA: ${{ github.sha }}
          CORE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/sync_shared_to_providers.py --providers-repo "$GITHUB_WORKSPACE/providers"
          cd providers
          if [ -z "$(git status --porcelain)" ]; then
            echo "HLE-Providers 的副本已是最新。 / The copies in HLE-Providers are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A
          git commit -m "chore: 同步核心仓库共享源码 / sync shared sources from the core repository" -m "来源提交 / Source commit: $CORE_URL"
          git push --force origin "$SYNC_BRANCH"
          if [ -n "$(gh pr list --repo "$PROVIDERS_REPO" --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "已有打开的同步 PR，分支已更新。 / A sync PR is already open; its branch has been updated."
            exit 0
          fi
          gh pr create --repo "$PROVIDERS_REPO" --base main --head "$SYNC_BRANCH" \
            --title "chore: 同步核心仓库共享源码 / sync shared sources from the core repository" \
            --body "$(printf '%s\n\n%s' \
              "由核心仓库 $CORE_URL 触发，运行 scripts/sync_shared_to_providers.py 生成。合并前请确认检查通过。" \
              "Triggered by $CORE_URL in the core repository and generated by scripts/sync_shared_to_providers.py. Please make sure the checks pass before merging.")"
